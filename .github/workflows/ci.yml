name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The tests run against the live API, so a nightly run is also a monitor:
    # if the published contract moves, this is where it shows up first.
    - cron: "17 4 * * *"

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -t .
        working-directory: python
        env:
          PYTHONPATH: src

  ruby:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ["3.1", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby -Ilib test/apparel_monster_test.rb
        working-directory: ruby

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: gofmt -l . | tee /dev/stderr | (! read)
        working-directory: go
      - run: go vet ./...
        working-directory: go
      - run: go test ./...
        working-directory: go
