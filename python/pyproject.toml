[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apparel-monster"
version = "1.0.0"
description = "SDK and CLI for the Apparel Monster agent commerce API: search the catalog, build a cart, place an order, mint a wallet link. No authentication."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Lugassy" }]
keywords = ["apparel-monster", "sdk", "cli", "api-client", "mcp", "agent", "agentic-commerce", "ecommerce", "spree"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://apparel.monster/developers"
Documentation = "https://apparel.monster/developers"
Repository = "https://github.com/mluggy/apparel-monster-dev"
Issues = "https://github.com/mluggy/apparel-monster-dev/issues"

[project.scripts]
apparel-monster = "apparel_monster.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apparel_monster"]
